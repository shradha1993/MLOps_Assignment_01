apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops
  template:
    metadata:
      labels:
        app: mlops
    spec:
      containers:
      - name: mlops-container
        image: mlops_assignment:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5001

--- 
apiVersion: v1
kind: Service
metadata:
  name: mlops-service
spec:
  type: LoadBalancer
  selector:
    app: mlops
  ports:
  - port: 5001
    targetPort: 5001
 