name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint code
        run: flake8 deployment tests

      - name: Run unit tests
        run: pytest -v --junitxml=reports/test-results.xml

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/test-results.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t mlops_assignment:latest .

      - name: Run container and test API
        run: |
          docker run -d --name mlops_container -p 5001:5001 mlops_assignment:latest
          echo "Waiting for FastAPI to start..."
          sleep 15
          echo "Testing /predict endpoint"
          curl -X POST http://localhost:5001/predict \
               -H "Content-Type: application/json" \
               -d '{"inputs": [[1,2,3]]}' || exit 1
          echo "Testing /metrics endpoint"
          curl http://localhost:5001/metrics || exit 1

      - name: Stop container
        run: docker stop mlops_container

      - name: Save Docker logs
        run: docker logs mlops_container > docker_logs.txt

      - name: Upload logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker_logs.txt
 