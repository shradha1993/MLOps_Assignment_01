name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLOPs_Assignment01/requirements.txt
          pip install pytest flake8

      - name: Lint code
        run: |
          flake8 MLOPs_Assignment01/deployment MLOPs_Assignment01/src MLOPs_Assignment01/test --max-line-length=120 --ignore=E501,W503,F401,F841 || true

      - name: Run unit tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/MLOPs_Assignment01
          cd MLOPs_Assignment01
          pytest -v --junitxml=../reports/test-results.xml

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: reports/test-results.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          cd MLOPs_Assignment01
          docker build -t mlops_assignment:latest .

      - name: Run container and test API
        run: |
          docker run -d --name mlops_container -p 5001:5001 mlops_assignment:latest
          echo "Waiting for FastAPI to start..."
          sleep 15
          echo "Testing /health endpoint"
          curl http://localhost:5001/health || exit 1
          echo "Testing /predict endpoint"
          curl -X POST http://localhost:5001/predict \
               -H "Content-Type: application/json" \
               -d '{"inputs": [[50,1,2,130,225,0,2,110,1,2.0,2,3.0,3.0]]}' || exit 1
          echo "Testing /metrics endpoint"
          curl http://localhost:5001/metrics || exit 1

      - name: Stop container
        run: docker stop mlops_container

      - name: Save Docker logs
        run: docker logs mlops_container > docker_logs.txt

      - name: Upload logs artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-logs
          path: docker_logs.txt
